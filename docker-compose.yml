version: "3"
services:
  gateway:
    build: ./gateway
    ports:
      - "5000:5000"
    depends_on:
      - service-a
      - service-b
  service-a:
    build: ./services/service-a
    ports:
      - "5001:5001"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/flight_booking_db
  service-b:
    build: ./services/service-b
    ports:
      - "5002:5002"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/flight_booking_db
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - gateway
  db:
    image: postgres:13
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=flight_booking_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
