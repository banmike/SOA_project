# Flight Service (Service A) API Specification
openapi: 3.0.0
info:
  title: Flight Service API
  version: 1.0.0
paths:
  /flights:
    get:
      summary: Search for available flights
      responses:
        "200":
          description: List of available flights
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    flight_id: { type: integer }
                    origin: { type: string }
                    destination: { type: string }
                    price: { type: number }
  /book:
    post:
      summary: Book a flight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: integer }
                flight_id: { type: integer }
      responses:
        "200":
          description: Booking confirmation
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking_id: { type: integer }
                  flight_id: { type: integer }
